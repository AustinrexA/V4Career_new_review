<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Credits & Subscription | V4Career</title><link rel="stylesheet" href="{{ url_for('static',filename='styles.css') }}"><link rel="stylesheet" href="{{ url_for('static',filename='credits.css') }}"></head><body class="credits-page"><main class="credits-container"><h1>Credits & Subscription</h1><p>Configure free credits and manage user balances, subscriptions, and account status.</p><section class="allocation-card"><label>New-user free credits <input id="allocation" type="number" min="0" value="5"></label><button onclick="send({action:'allocation',amount:document.getElementById('allocation').value})">Save allocation</button></section><h2>User accounts</h2><div id="users">Loading...</div><h2>Credit consumption history</h2><div id="history">Loading...</div></main><script>
async function send(data){let r=await fetch('/api/admin/credits',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});let d=await r.json();alert(d.error||'Saved');load();}
async function load(){let r=await fetch('/api/admin/credits'),d=await r.json();document.getElementById('allocation').value=d.free_credits;document.getElementById('users').innerHTML='<table class="credits-table"><tr><th>User</th><th>Email</th><th>Balance</th><th>Status</th><th>Subscription</th><th>Actions</th></tr>'+d.users.map(u=>`<tr><td>${u.username}</td><td>${u.email||''}</td><td>${u.balance}</td><td>${u.account_status}</td><td>${u.subscription_plan} / ${u.subscription_status}</td><td><input id="amt-${u.username}" type="number" min="0" value="5" style="width:60px"><button onclick="send({action:'add',username:'${u.username}',amount:document.getElementById('amt-${u.username}').value})">Add</button><button onclick="send({action:'deduct',username:'${u.username}',amount:document.getElementById('amt-${u.username}').value})">Deduct</button><button onclick="send({action:'reset',username:'${u.username}'})">Reset</button><button onclick="send({action:'status',username:'${u.username}',status:'${u.account_status==='active'?'suspended':'active'}'})">${u.account_status==='active'?'Suspend':'Activate'}</button><button onclick="send({action:'subscription',username:'${u.username}',plan:prompt('Plan name','premium')||'free',subscription_status:'active'})">Subscription</button></td></tr>`).join('')+'</table>';document.getElementById('history').innerHTML='<table class="credits-table"><tr><th>Date</th><th>User</th><th>Action</th><th>Amount</th><th>Balance</th><th>Job</th></tr>'+d.history.map(h=>`<tr><td>${h.created_at||''}</td><td>${h.username}</td><td>${h.action}</td><td>${h.amount}</td><td>${h.balance_after}</td><td>${h.job_title||''}</td></tr>`).join('')+'</table>';}load();
</script></body></html>
