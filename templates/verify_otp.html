<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Verify email | V4Career</title><link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
<style>
body{margin:0;background:linear-gradient(135deg,#FFF9F3,#fff 58%,#FFE8D8);font-family:Arial,sans-serif}
.wrap{min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(100%,420px);box-sizing:border-box;background:#fff;border:1px solid #EADFD5;border-radius:16px;padding:34px;box-shadow:0 18px 55px rgba(82,54,32,.12)}
h1{text-align:center;color:#263445;font-size:26px;margin:0 0 10px}.sub{text-align:center;color:#786B60;line-height:1.5;margin:0 0 24px}
label{display:block;margin:0 0 7px;color:#263445;font-weight:600}input{box-sizing:border-box;width:100%;height:48px;border:1px solid #cbd5e1;border-radius:7px;padding:0 12px;font-size:20px;letter-spacing:5px;text-align:center}
button{width:100%;height:46px;border:0;border-radius:7px;background:#FF6700;color:white;font-weight:700;cursor:pointer;margin-top:14px}
.error{padding:11px;margin-bottom:16px;border-radius:7px;background:#fff0ef;border:1px solid #f4c7c3;color:#a52820;font-size:13px}.actions{display:flex;gap:10px;margin-top:15px}.actions form{flex:1}.actions button{background:#f3f4f6;color:#334155;margin:0}.footer{text-align:center;color:#786B60;font-size:12px;margin-top:22px}
</style></head><body><main class="wrap"><section class="card"><h1>Verify your email</h1><p class="sub">Enter the six-digit code sent to <strong>{{ email }}</strong>.</p>
{% if error %}<div class="error" role="alert">{{ error }}</div>{% endif %}
<form method="post" action="{{ url_for('verify_otp') }}"><label for="otp">Verification code</label>
<input id="otp" name="otp" type="text" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" placeholder="000000" required autofocus>
<button type="submit">Verify &amp; sign in</button></form>
<div class="actions"><form method="post" action="{{ url_for('resend_otp') }}"><button type="submit">Resend code</button></form><form method="get" action="{{ url_for('login') }}"><button type="submit">Change email</button></form></div>
<p class="footer">V4Career · Job Opportunities Portal</p></section></main></body></html>
